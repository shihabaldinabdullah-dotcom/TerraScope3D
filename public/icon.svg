<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="35%" r="75%">
      <stop offset="0%" stop-color="#0f2547" />
      <stop offset="100%" stop-color="#07111f" />
    </radialGradient>
    <radialGradient id="earthGrad" cx="38%" cy="32%" r="65%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="45%" stop-color="#1d4ed8" />
      <stop offset="100%" stop-color="#0c244a" />
    </radialGradient>
    <linearGradient id="orbitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.95" />
      <stop offset="50%" stop-color="#60a5fa" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.95" />
    </linearGradient>
    <clipPath id="globeClip">
      <circle cx="256" cy="256" r="142" />
    </clipPath>
  </defs>

  <!-- Deep Space Backdrop -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Subtle Stars -->
  <circle cx="92" cy="98" r="4" fill="#93c5fd" opacity="0.85" />
  <circle cx="424" cy="112" r="3.5" fill="#fde68a" opacity="0.8" />
  <circle cx="104" cy="406" r="3.5" fill="#e0f2fe" opacity="0.7" />
  <circle cx="412" cy="392" r="4" fill="#38bdf8" opacity="0.75" />

  <!-- Atmospheric Halo -->
  <circle cx="256" cy="256" r="158" fill="#38bdf8" opacity="0.16" />

  <!-- Earth Sphere -->
  <circle cx="256" cy="256" r="142" fill="url(#earthGrad)" stroke="#7dd3fc" stroke-width="3" stroke-opacity="0.55" />

  <!-- Stylized Continents clipped inside globe -->
  <g clip-path="url(#globeClip)" opacity="0.88">
    <path d="M168 176c24-22 68-26 98-8 16 10 22 28 8 42-18 18-14 34 8 46 22 12 20 44-4 66-18 16-42 12-54-12-10-20-34-24-48-44-16-24-26-72-8-90z" fill="#10b981" />
    <path d="M294 162c32-12 72 8 86 42 12 28-8 56-34 62-22 6-30-16-44-32-14-16-32-62-8-72z" fill="#34d399" />
    <path d="M312 284c20-6 46 8 48 30 2 22-22 44-44 36-18-6-24-60-4-66z" fill="#10b981" />
    <!-- Specular crescent highlight -->
    <ellipse cx="205" cy="195" rx="68" ry="42" transform="rotate(-28 205 195)" fill="#ffffff" opacity="0.14" />
  </g>

  <!-- Tilted Satellite Orbit Ring -->
  <ellipse cx="256" cy="256" rx="208" ry="74" transform="rotate(-26 256 256)" fill="none" stroke="url(#orbitGrad)" stroke-width="10" stroke-linecap="round" />

  <!-- Orbiting Satellite Beacon -->
  <g transform="translate(402 178)">
    <circle cx="0" cy="0" r="18" fill="#f59e0b" opacity="0.28" />
    <circle cx="0" cy="0" r="10" fill="#fbbf24" stroke="#ffffff" stroke-width="3" />
  </g>
</svg>
